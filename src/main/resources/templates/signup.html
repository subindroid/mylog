<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogLive - 회원가입</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>

<body>
    <div class="signup-card">
        <h1 class="brand-title">SIGN UP<span>.</span></h1>
        <p class="subtitle">LogLive 시작을 위한 회원가입</p>

        <form th:action="@{/diary/user}" method="POST">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

            <div class="form-group">
                <label class="form-label">사용자 ID</label>
                <input type="text" class="form-control" name="username" required placeholder="사용할 아이디를 입력하세요">
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" class="form-control" name="password" required placeholder="사용할 비밀번호를 입력하세요">
            </div>

            <button type="submit" class="btn-submit">가입하기</button>
        </form>

        <a th:href="@{/diary/login}" class="btn-login">이미 계정이 있으신가요? 로그인</a>
    </div>
</body>

</html>
