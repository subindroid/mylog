<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogLive - 로그인</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
    <div class="login-card">
        <h1 class="brand-title">LogLive<span>.</span></h1>
        <p class="subtitle">서비스를 사용하려면 로그인해 주세요!</p>

        <form th:action="@{/diary/login}" method="POST">
            <div th:if="${param.error}" class="alert-error">
                사용자 ID 또는 비밀번호를 확인해 주세요.
            </div>

            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

            <div class="form-group">
                <label class="form-label">사용자 ID</label>
                <input type="text" class="form-control" name="username" required placeholder="아이디를 입력하세요">
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" class="form-control" name="password" required placeholder="비밀번호를 입력하세요">
            </div>

            <button type="submit" class="btn-submit">로그인</button>
        </form>

        <button type="button" class="btn-signup" onclick="location.href='/diary/signup'">회원가입 하러가기</button>
    </div>
</body>

</html>
