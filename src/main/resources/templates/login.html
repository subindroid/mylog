<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogLive - 로그인</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #120e24;
            --bg-card: rgba(26, 22, 48, 0.85);
            --purple-main: #9d4edd;
            --purple-light: #c77dff;
            --pink-accent: #ff007f;
            --text-main: #f8f9fa;
            --text-sub: #b8c0e0;
            --border-color: rgba(157, 78, 221, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(157, 78, 221, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 127, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(157, 78, 221, 0.2);
            text-align: center;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .brand-title span {
            color: var(--pink-accent);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--purple-light);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(18, 14, 36, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            border-color: var(--pink-accent);
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.3);
            background: rgba(18, 14, 36, 0.9);
        }

        .alert-error {
            background: rgba(255, 0, 127, 0.15);
            border: 1px solid var(--pink-accent);
            color: #ff85c0;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--purple-main), var(--pink-accent));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
            transition: all 0.25s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
        }

        .btn-signup {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.25s ease;
        }

        .btn-signup:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--purple-light);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1 class="brand-title">LogLive<span>.</span></h1>
        <p class="subtitle">서비스를 사용하려면 로그인해 주세요!</p>

        <form th:action="@{/diary/login}" method="POST">
            <div th:if="${param.error}" class="alert-error">
                사용자 ID 또는 비밀번호를 확인해 주세요.
            </div>

            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

            <div class="form-group">
                <label class="form-label">사용자 ID</label>
                <input type="text" class="form-control" name="username" required placeholder="아이디를 입력하세요">
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" class="form-control" name="password" required placeholder="비밀번호를 입력하세요">
            </div>

            <button type="submit" class="btn-submit">로그인</button>
        </form>

        <button type="button" class="btn-signup" onclick="location.href='/diary/signup'">회원가입 하러가기</button>
    </div>
</body>

</html>
