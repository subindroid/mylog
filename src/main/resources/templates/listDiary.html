<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogLive - 다이어리 목록</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/listDiary.css}">
</head>

<body>
    <div class="container">
        <header>
            <a href="#" th:href="@{/diary/list}" class="logo">LogLive <span>DIARY</span></a>
            <nav class="nav-links">
                <a sec:authorize="isAnonymous()" th:href="@{/diary/login}" class="btn-nav">로그인</a>
                <a sec:authorize="isAuthenticated()" th:href="@{/diary/profile}" class="btn-nav">내 프로필</a>
                <a sec:authorize="isAuthenticated()" th:href="@{/diary/logout}" class="btn-nav">로그아웃</a>
                <a sec:authorize="isAnonymous()" th:href="@{/diary/signup}" class="btn-nav">회원가입</a>
            </nav>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th width="10%">번호</th>
                        <th width="18%">작성자</th>
                        <th width="52%">제목</th>
                        <th width="20%">작성일</th>
                    </tr>
                </thead>
                <tbody th:if="${#lists.isEmpty(dataList)}">
                    <tr>
                        <td colspan="4" class="empty-msg">등록된 다이어리가 없습니다. 첫 레포를 올려보세요!</td>
                    </tr>
                </tbody>
                <tbody th:unless="${#lists.isEmpty(dataList)}">
                    <tr th:each="diary, diaryStat : ${dataList}">
                        <td th:text="${diaryStat.count}">1</td>
                        <td th:text="${diary.user?.username}">작성자</td>
                        <td>
                            <a class="article-title-link" th:href="@{/diary/viewDiary(no=${diary.id})}" th:text="${diary.title}">
                                다이어리 제목입니다.
                            </a>
                        </td>
                        <td th:text="${#temporals.format(diary.writeDate, 'yyyy-MM-dd')}">2026-09-17</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="btn-write-container">
            <a th:href="@{/diary/add}" class="btn-primary">✏️ 새 다이어리 작성</a>
        </div>
    </div>
</body>

</html>
