<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>LogLive - 관리자 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/dashboard.css}">
</head>
<body>

    <div class="header">
        <h1>LogLive <span>ADMIN DASHBOARD</span></h1>
        <a th:href="@{/diary/listDiary}" class="btn-home">메인 서비스로 돌아가기</a>
    </div>

    <div class="dashboard-grid" th:with="currentUsername=${#authentication.name}">

        <!-- 1. 다이어리(글) 관리 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">📝 게시물 관리 (최신 5개)</span>
            </div>
            <table>
                <thead>
                    <tr><th>ID</th><th>제목</th><th>작성자</th><th>관리</th></tr>
                </thead>
                <tbody>
                    <tr th:each="diary : ${diaries}">
                        <td th:text="${diary.id}">1</td>
                        <td><a th:href="@{/diary/viewDiary(no=${diary.id})}" th:text="${diary.title}" style="color: white; text-decoration: none;">제목</a></td>
                        <td th:text="${diary.user?.username}">유저</td>
                        <td>
                            <form th:action="@{/admin/diaries/delete}" method="post" style="display:inline;">
                                <input type="hidden" name="diaryId" th:value="${diary.id}">
                                <button type="submit" class="btn-sm btn-danger" onclick="return confirm('이 글을 삭제하시겠습니까?')">삭제</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 2. 유저 관리 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">👥 회원 관리</span>
            </div>
            <table>
                <thead>
                    <tr><th>ID</th><th>유저명</th><th>Role</th><th>상태</th><th>제어</th></tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}">1</td>
                        <td th:text="${u.username}">admin</td>
                        <td>
                            <!-- 본인 계정 권한 변경 방지 조건 -->
                            <form th:action="@{/admin/users/change-role}" method="post" class="form-inline" th:if="${u.username != currentUsername}">
                                <input type="hidden" name="userId" th:value="${u.id}">
                                <select name="roleName" onchange="this.form.submit()">
                                    <option value="USER" th:selected="${u.role?.rolename == 'ROLE_USER'}">USER</option>
                                    <option value="ADMIN" th:selected="${u.role?.rolename == 'ROLE_ADMIN'}">ADMIN</option>
                                </select>
                            </form>
                            <span th:if="${u.username == currentUsername}" class="badge badge-admin">ADMIN (본인)</span>
                        </td>
                        <td>
                            <span th:text="${u.enabled ? '활성' : '정지'}" th:style="${u.enabled ? 'color: var(--teal-accent);' : 'color: var(--pink-accent);'}">활성</span>
                        </td>
                        <td>
                            <!-- 본인 계정 Disable 방지 조건 -->
                            <form th:action="@{/admin/users/toggle-enabled}" method="post" th:if="${u.username != currentUsername}">
                                <input type="hidden" name="userId" th:value="${u.id}">
                                <button type="submit" class="btn-sm btn-secondary" th:text="${u.enabled ? '정지하기' : '해제하기'}">토글</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 3. 장소(Venue) 관리 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">📍 회장(Venue) DB 관리</span>
            </div>
            <!-- 간단 추가 폼 -->
            <form th:action="@{/admin/venues/add}" method="post" style="margin-bottom: 12px;" class="form-inline">
                <input type="text" name="name" placeholder="회장명" required />
                <input type="text" name="address" placeholder="주소" required />
                <button type="submit" class="btn-sm btn-primary">등록</button>
            </form>
            <table>
                <thead>
                    <tr><th>ID</th><th>장소명</th><th>주소</th><th>관리</th></tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${venues}">
                        <td th:text="${v.id}">1</td>
                        <td th:text="${v.name}">홍대 클럽</td>
                        <td th:text="${v.address}">서울시 마포구</td>
                        <td>
                            <form th:action="@{/admin/venues/delete}" method="post" style="display:inline;">
                                <input type="hidden" name="venueId" th:value="${v.id}">
                                <button type="submit" class="btn-sm btn-danger">삭제</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 4. 이벤트(Event) 관리 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">🎤 공식 라이브 이벤트 DB 관리</span>
            </div>
            <!-- 간단 추가 폼 -->
            <form th:action="@{/admin/events/add}" method="post" style="margin-bottom: 12px;" class="form-inline">
                <input type="text" name="name" placeholder="이벤트명" required />
                <input type="date" name="eventDate" required style="background: rgba(18, 14, 36, 0.8); color: white; border: 1px solid var(--border-color); border-radius: 6px; padding: 4px;" />
                <button type="submit" class="btn-sm btn-primary">등록</button>
            </form>
            <table>
                <thead>
                    <tr><th>ID</th><th>이벤트명</th><th>일시</th><th>관리</th></tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${events}">
                        <td th:text="${e.id}">1</td>
                        <td th:text="${e.name}">LogLive Vol.1</td>
                        <td th:text="${#temporals.format(e.eventDate, 'yyyy-MM-dd')}">2026-09-21</td>
                        <td>
                            <form th:action="@{/admin/events/delete}" method="post" style="display:inline;">
                                <input type="hidden" name="eventId" th:value="${e.id}">
                                <button type="submit" class="btn-sm btn-danger">삭제</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>
</html>
