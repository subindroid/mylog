<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogLive - 프로필 작성</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/writeProfile.css}">
    <script th:inline="javascript">
        function backToProfile(frm) {
            frm.method = "get";
            frm.action = /*[[@{/diary/profile}]]*/ "";
            frm.submit();
        }
    </script>
</head>

<body>
    <div class="container">
        <h1 class="page-title">프로필 <span>작성</span></h1>

        <form name="profileForm" method="post" th:action="@{/diary/profile/addprofile}">
            <div class="form-row">
                <label>닉네임</label>
                <input type="text" maxlength="50" name="nickname" required placeholder="닉네임을 입력해 주세요." />
            </div>

            <div class="form-row">
                <label>활동 지역</label>
                <input type="text" maxlength="100" name="location" placeholder="예: 서울, 경기" />
            </div>

            <div class="form-row">
                <label>자기소개</label>
                <textarea name="bio" rows="6" maxlength="255" placeholder="나만의 취향이나 좋아하는 아티스트를 소개해 보세요."></textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">저장하기</button>
                <button type="button" class="btn btn-secondary" onclick="backToProfile(profileForm)">취소</button>
            </div>
        </form>
    </div>
</body>

</html>
