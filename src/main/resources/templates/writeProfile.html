<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogLive - 프로필 작성</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #120e24;
            --bg-card: rgba(26, 22, 48, 0.8);
            --purple-main: #9d4edd;
            --purple-light: #c77dff;
            --pink-accent: #ff007f;
            --teal-accent: #00f5d4;
            --text-main: #f8f9fa;
            --text-sub: #b8c0e0;
            --border-color: rgba(157, 78, 221, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(157, 78, 221, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 245, 212, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .page-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-main);
        }

        .page-title span {
            color: var(--teal-accent);
        }

        .form-row {
            margin-bottom: 20px;
        }

        .form-row label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--purple-light);
            margin-bottom: 8px;
        }

        .form-row input[type="text"],
        .form-row textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(18, 14, 36, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-row input[type="text"]:focus,
        .form-row textarea:focus {
            border-color: var(--teal-accent);
            box-shadow: 0 0 12px rgba(0, 245, 212, 0.3);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--purple-main), var(--teal-accent));
            color: #120e24;
            box-shadow: 0 4px 15px rgba(0, 245, 212, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 245, 212, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
        }

        .btn-secondary:hover {
            background: rgba(157, 78, 221, 0.2);
            color: white;
            transform: translateY(-2px);
        }
    </style>
    <script th:inline="javascript">
        function backToProfile(frm) {
            frm.method = "get";
            frm.action = /*[[@{/diary/profile}]]*/ "";
            frm.submit();
        }
    </script>
</head>

<body>
    <div class="container">
        <h1 class="page-title">프로필 <span>작성</span></h1>

        <form name="profileForm" method="post" th:action="@{/diary/profile/addprofile}">
            <div class="form-row">
                <label>닉네임</label>
                <input type="text" maxlength="50" name="nickname" required placeholder="닉네임을 입력해 주세요." />
            </div>

            <div class="form-row">
                <label>활동 지역</label>
                <input type="text" maxlength="100" name="location" placeholder="예: 서울, 경기" />
            </div>

            <div class="form-row">
                <label>자기소개</label>
                <textarea name="bio" rows="6" maxlength="255" placeholder="나만의 취향이나 좋아하는 아티스트를 소개해 보세요."></textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">저장하기</button>
                <button type="button" class="btn btn-secondary" onclick="backToProfile(profileForm)">취소</button>
            </div>
        </form>
    </div>
</body>

</html>
