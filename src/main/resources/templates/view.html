<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 1. Spring Security CSRF Meta Tags 추가 -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <title>LogLive - 다이어리 상세</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/viewDiary.css}">
    <script th:inline="javascript">
        function backToList() {
            location.href = /*[[@{/diary/list}]]*/ "/diary/list";
        }

        function fn_enable() {
            document.querySelector("#i_title").disabled = false;
            document.querySelector("#i_content").disabled = false;
            document.querySelector("#tr_btn").style.display = "none";
            document.querySelector("#tr_btn_modify").style.display = "flex";
        }

        function fn_modify_article(frm) {
            frm.action = /*[[@{/diary/edit}]]*/ "";
            frm.submit();
        }

        // 2. CSRF 토큰을 동적으로 Form에 동봉하도록 수정된 fn_remove
        function fn_remove(url, no) {
            if (confirm("정말 삭제하시겠습니까?")) {
                let form = document.createElement("form");
                form.setAttribute("method", "post");
                form.setAttribute("action", url);
                
                // 다이어리 ID 번호 전달
                let inputNo = document.createElement("input");
                inputNo.setAttribute("type", "hidden");
                inputNo.setAttribute("name", "diaryNo");
                inputNo.setAttribute("value", no);
                form.appendChild(inputNo);

                // CSRF 토큰 읽어와서 동적 hidden input 추가
                let csrfToken = document.querySelector("meta[name='_csrf']")?.getAttribute("content");
                if (csrfToken) {
                    let inputCsrf = document.createElement("input");
                    inputCsrf.setAttribute("type", "hidden");
                    inputCsrf.setAttribute("name", "_csrf");
                    inputCsrf.setAttribute("value", csrfToken);
                    form.appendChild(inputCsrf);
                }

                document.body.appendChild(form);
                form.submit();
            }
        }
    </script>
</head>

<body>
    <div class="container">
        <h1 class="page-title">LIVE <span>LOG</span></h1>

        <form name="articleForm" method="post" th:action="@{/diary/edit}">
            <input type="hidden" th:value="${diary.id}" name="id" />

            <div class="info-grid">
                <div class="form-group">
                    <label>글 번호</label>
                    <input type="text" th:value="${diary.id}" disabled />
                </div>
                <div class="form-group">
                    <label>작성자</label>
                    <input type="text" th:value="${diary.user?.username}" disabled /> <!--[cite: 1] -->
                </div>
            </div>

            <div class="form-group">
                <label>제목</label>
                <input type="text" th:value="${diary.title}" name="title" id="i_title" disabled />
            </div>

            <div class="info-grid">
                <div class="form-group">
                    <label>이벤트 명</label>
                    <input type="text" th:value="${diary.event?.name}" disabled />
                </div>
                <div class="form-group">
                    <label>공연장 (회장)</label>
                    <input type="text" th:value="${diary.event?.venue?.name}" disabled />
                </div>
            </div>

            <div class="form-group">
                <label>내용</label>
                <textarea rows="10" name="content" id="i_content" disabled th:text="${diary.content}"></textarea>
            </div>

            <div class="form-group">
                <label>작성일시</label>
                <input type="text" th:value="${#temporals.format(diary.writeDate, 'yyyy-MM-dd HH:mm')}" disabled />
            </div>

            <th:block th:with="currentUsername=${#authentication.name}">
                <!-- 작성자 본인 제어 버튼 -->
                <div class="btn-group" id="tr_btn" th:if="${diary.user != null and diary.user.username == currentUsername}"> <!--[cite: 1] -->
                    <button type="button" class="btn btn-primary" onclick="fn_enable()">수정</button>
                    <button type="button" class="btn btn-danger" th:onclick="|fn_remove('@{/diary/remove}', '${diary.id}')|">삭제</button>
                    <button type="button" class="btn btn-secondary" onclick="backToList()">목록보기</button>
                </div>

                <!-- 타인 조회 시 버튼 -->
                <div class="btn-group" th:unless="${diary.user != null and diary.user.username == currentUsername}"> <!--[cite: 1] -->
                    <button type="button" class="btn btn-secondary" onclick="backToList()">목록보기</button>
                </div>
            </th:block>

            <!-- 수정용 버튼 -->
            <div class="btn-group" id="tr_btn_modify">
                <button type="button" class="btn btn-primary" onclick="fn_modify_article(articleForm)">저장</button>
                <button type="button" class="btn btn-secondary" onclick="location.reload()">취소</button>
            </div>
        </form>
    </div>
</body>

</html>
