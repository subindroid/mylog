<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogLive - 프로필 조회</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <script th:inline="javascript">
        function fn_enable() {
            document.querySelector("#i_nickname").disabled = false;
            document.querySelector("#i_location").disabled = false;
            document.querySelector("#i_bio").disabled = false;
            document.querySelector("#tr_btn").style.display = "none";
            document.querySelector("#tr_btn_modify").style.display = "flex";
        }
        function fn_modify_profile(frm) {
            frm.action = /*[[@{/diary/profile/edit}]]*/ "";
            frm.submit();
        }
    </script>
</head>

<body>
    <div class="container">
        <h1 class="page-title">내 <span>프로필</span></h1>

        <!-- 1. 프로필 미등록 시 -->
        <div th:if="${profile == null}" class="no-profile-box">
            <h2>등록된 프로필이 없습니다.</h2>
            <p>프로필을 작성하여 나만의 라이브 로그 다이어리를 시작해 보세요!</p>
            <a th:href="@{/diary/profile/add}" class="btn btn-primary">프로필 작성하러 가기</a>
        </div>

        <!-- 2. 프로필 존재 시 -->
        <form th:if="${profile != null}" name="profileForm" method="post" th:action="@{/diary/profile/edit}">
            <div class="form-row">
                <label>닉네임</label>
                <input type="text" th:value="${profile.nickname}" name="nickname" id="i_nickname" disabled />
            </div>

            <div class="form-row">
                <label>활동 지역</label>
                <input type="text" th:value="${profile.location}" name="location" id="i_location" disabled />
            </div>

            <div class="form-row">
                <label>자기소개</label>
                <textarea rows="5" name="bio" id="i_bio" disabled th:text="${profile.bio}"></textarea>
            </div>

            <div class="btn-group" id="tr_btn">
                <button type="button" class="btn btn-primary" onclick="fn_enable()">수정하기</button>
                <a th:href="@{/diary/list}" class="btn btn-secondary">목록으로</a>
            </div>

            <div class="btn-group" id="tr_btn_modify">
                <button type="button" class="btn btn-primary" onclick="fn_modify_profile(profileForm)">저장</button>
                <button type="button" class="btn btn-secondary" onclick="location.reload()">취소</button>
            </div>
        </form>
    </div>
</body>

</html>
