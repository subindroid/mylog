<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogLive - 프로필 조회</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #120e24;
            --bg-card: rgba(26, 22, 48, 0.8);
            --purple-main: #9d4edd;
            --purple-light: #c77dff;
            --pink-accent: #ff007f;
            --teal-accent: #00f5d4;
            --text-main: #f8f9fa;
            --text-sub: #b8c0e0;
            --border-color: rgba(157, 78, 221, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(157, 78, 221, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 0, 127, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .page-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-main);
        }

        .page-title span {
            color: var(--purple-light);
        }

        .no-profile-box {
            text-align: center;
            padding: 40px 0;
        }

        .no-profile-box h2 {
            font-size: 20px;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .no-profile-box p {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
        }

        .form-row {
            margin-bottom: 20px;
        }

        .form-row label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--purple-light);
            margin-bottom: 8px;
        }

        .form-row input[type="text"],
        .form-row textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(18, 14, 36, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-row input[type="text"]:disabled,
        .form-row textarea:disabled {
            opacity: 0.7;
            background: rgba(18, 14, 36, 0.3);
            border-color: rgba(255, 255, 255, 0.08);
            cursor: not-allowed;
        }

        .form-row input[type="text"]:focus,
        .form-row textarea:focus {
            border-color: var(--pink-accent);
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.3);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--purple-main), var(--pink-accent));
            color: white;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
        }

        .btn-secondary:hover {
            background: rgba(157, 78, 221, 0.2);
            color: white;
            transform: translateY(-2px);
        }

        #tr_btn_modify {
            display: none;
        }
    </style>
    <script th:inline="javascript">
        function fn_enable() {
            document.querySelector("#i_nickname").disabled = false;
            document.querySelector("#i_location").disabled = false;
            document.querySelector("#i_bio").disabled = false;
            document.querySelector("#tr_btn").style.display = "none";
            document.querySelector("#tr_btn_modify").style.display = "flex";
        }
        function fn_modify_profile(frm) {
            frm.action = /*[[@{/diary/profile/edit}]]*/ "";
            frm.submit();
        }
    </script>
</head>

<body>
    <div class="container">
        <h1 class="page-title">내 <span>프로필</span></h1>

        <!-- 1. 프로필 미등록 시 -->
        <div th:if="${profile == null}" class="no-profile-box">
            <h2>등록된 프로필이 없습니다.</h2>
            <p>프로필을 작성하여 나만의 라이브 로그 다이어리를 시작해 보세요!</p>
            <a th:href="@{/diary/profile/add}" class="btn btn-primary">프로필 작성하러 가기</a>
        </div>

        <!-- 2. 프로필 존재 시 -->
        <form th:if="${profile != null}" name="profileForm" method="post" th:action="@{/diary/profile/edit}">
            <div class="form-row">
                <label>닉네임</label>
                <input type="text" th:value="${profile.nickname}" name="nickname" id="i_nickname" disabled />
            </div>

            <div class="form-row">
                <label>활동 지역</label>
                <input type="text" th:value="${profile.location}" name="location" id="i_location" disabled />
            </div>

            <div class="form-row">
                <label>자기소개</label>
                <textarea rows="5" name="bio" id="i_bio" disabled th:text="${profile.bio}"></textarea>
            </div>

            <div class="btn-group" id="tr_btn">
                <button type="button" class="btn btn-primary" onclick="fn_enable()">수정하기</button>
                <a th:href="@{/diary/list}" class="btn btn-secondary">목록으로</a>
            </div>

            <div class="btn-group" id="tr_btn_modify">
                <button type="button" class="btn btn-primary" onclick="fn_modify_profile(profileForm)">저장</button>
                <button type="button" class="btn btn-secondary" onclick="location.reload()">취소</button>
            </div>
        </form>
    </div>
</body>

</html>
